server.port=8081
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:testplus}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.liquibase.enabled=false

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
subscription.trial-days=${SUBSCRIPTION_TRIAL_DAYS:3}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

spring.mail.host=${TESTPULSE_MAIL_HOST}
spring.mail.port=${TESTPULSE_MAIL_PORT:465}
spring.mail.username=${TESTPULSE_MAIL_USERNAME}
spring.mail.password=${TESTPULSE_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

spring.cache.type=simple
spring.cache.cache-names=users,tests,questions,subscriptionPlans,coupons,bookmarks,appConfig,testAttempts