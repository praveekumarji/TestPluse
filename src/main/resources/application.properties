# Spring Boot Application Properties

# Server Configuration

spring.profiles.active=${ENV:dev}
# Spring Boot Application Properties

# Server Configuration
server.port=8081

# Logging Configuration
logging.level.com.testpulse=INFO
logging.level.com.testpulse.service.impl.QuestionServiceImpl=DEBUG
logging.file.name=logs/testpulse.log

# Database Configuration
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/testdb?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Liquibase Configuration
spring.liquibase.enabled=false

# JWT Configuration
jwt.secret=your_jwt_secret_key
jwt.expiration=3600000

# Cache Configuration
# Cache type: simple (ConcurrentHashMap), caffeine, redis, etc.
spring.cache.type=simple

# Cache names to enable
spring.cache.cache-names=users,tests,questions,subscriptionPlans,coupons,bookmarks,appConfig,testAttempts

# Caffeine Cache Configuration (optional - for better performance)
# Uncomment below and add caffeine dependency if you want to use Caffeine cache
# spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=600s

# Enable cache statistics (for monitoring)
spring.cache.cache-names=users,tests,questions,subscriptionPlans,coupons,bookmarks,appConfig,testAttempts
